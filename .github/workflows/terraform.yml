name: Terraform CI/CD

on:
  push:
    # Adjust branches as needed. The Jenkins pipeline used branch names like "ENV-prod".
    branches:
      - "development"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan + Checkov
    environment: dev-vars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.5"

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Set Terraform Azure environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

      - name: Write backend config
        run: |
          cat > gk-backend.conf <<EOF
          resource_group_name  = "${{ secrets.BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ secrets.BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ secrets.BACKEND_CONTAINER }}"
          key                  = "${{ secrets.BACKEND_KEY }}"
          subscription_id      = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id            = "${{ secrets.AZURE_TENANT_ID }}"
          EOF

      - name: Fetch tfvars from Azure Key Vault (optional)
        # If you store the full tfvars file as a Key Vault secret, set these repo secrets:
        # - KEYVAULT_NAME
        # - KEYVAULT_TFVARS_SECRET_NAME
        # The workflow will retrieve the secret value and write `terraform.tfvars`.
        run: |
          if [ -n "${{ secrets.KEYVAULT_NAME }}" ] && [ -n "${{ secrets.KEYVAULT_TFVARS_SECRET_NAME }}" ]; then
            echo "Retrieving terraform.tfvars from Key Vault ${{ secrets.KEYVAULT_NAME }}..."
            set -e
            TFVARS_VAL=$(az keyvault secret show --vault-name "${{ secrets.KEYVAULT_NAME }}" --name "${{ secrets.KEYVAULT_TFVARS_SECRET_NAME }}" --query value -o tsv)
            # Try decoding as base64 first; if that fails, write raw value
            if echo "$TFVARS_VAL" | base64 --decode > terraform.tfvars 2>/dev/null; then
              echo "Successfully decoded base64 secret."
            else
              echo -e "$TFVARS_VAL" > terraform.tfvars
              echo "Wrote raw secret value."
            fi
            echo "terraform.tfvars has been created from Key Vault secret."
          else
            echo "KEYVAULT_NAME or KEYVAULT_TFVARS_SECRET_NAME not set; skipping Key Vault fetch."
          fi

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfvars-artifacts
          path: |
            terraform.tfvars

      - name: Terraform Init
        run: terraform init -upgrade -backend-config=gk-backend.conf -no-color

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan -input=false -no-color
          terraform show -no-color -json tfplan > tfplan.json

      - name: Install Checkov
        run: python -m pip install --upgrade pip && python -m pip install checkov==3.1.38

      - name: Run Checkov (scan tfplan)
        run: checkov --soft-fail -f tfplan.json || true

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-artifacts
          path: |
            tfplan
            tfplan.json

  apply:
    name: Terraform Apply (requires approval)
    runs-on: ubuntu-latest
    needs: plan
    environment: dev-vars-approvers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.5"

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Set Terraform Azure environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

      - name: Download plan artifacts
        uses: actions/download-artifact@v4
        with:
          name: tfplan-artifacts

      - name: Recreate backend config
        run: |
          cat > gk-backend.conf <<EOF
          resource_group_name  = "${{ secrets.BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ secrets.BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ secrets.BACKEND_CONTAINER }}"
          key                  = "${{ secrets.BACKEND_KEY }}"
          subscription_id      = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id            = "${{ secrets.AZURE_TENANT_ID }}"
          EOF

      - name: Terraform Init (reinit before apply)
        run: terraform init -upgrade -backend-config=gk-backend.conf -no-color

      - name: Terraform Apply (approved)
        run: terraform apply -no-color tfplan

      - name: Cleanup .terraform directory
        run: rm -rf .terraform || true
